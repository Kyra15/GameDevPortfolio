<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>resume</title>
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }

            #game-modal {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 10;
                background: rgba(0,0,0,0.7);
                display: flex;
                align-items: center;
                justify-content: center;              
            }

            #game-frame {
                width: 90%;
                height: 90%;
                border: none;
                display: block;
            }

            #close-btn {
                position: absolute;
                top: 0.1vh;
                right: 0.1vw;
                z-index: 11;
                padding: 4px 16px 4px 16px;
                font-size: 32px;
                background-color: #6691ed;
                box-shadow: none;
                border: none; 
                border-radius: 8px; 
            }

            #close-btn:hover {
                background-color: #5469e3;
            }

        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <div id="game-modal" style="display:none;">
            <button id="close-btn">✕</button>
            <iframe id="game-frame" src=""></iframe>
        </div>

        <script src="./phaser.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
